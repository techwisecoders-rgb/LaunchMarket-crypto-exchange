# Railway config for the SIDRA backend (NestJS)
# Reference: https://docs.railway.app/reference/config-as-code
[build]
builder = "NIXPACKS"
buildCommand = "npm install --workspaces --include-workspace-root && npm run prisma:generate && npm run build:backend"

[deploy]
startCommand = "npx prisma migrate deploy && npm run start:prod --workspace backend"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10